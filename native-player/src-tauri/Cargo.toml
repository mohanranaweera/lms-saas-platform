[package]
name = "aoc-player"
version = "0.1.0"
description = "AOC Secure Player (ADR-025)"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "aoc_player_lib"
crate-type = ["rlib"]

[features]
# Release builds only: wires the Tauri updater. It needs the updater public key
# in tauri.conf (see README); dev builds carry no updater at all.
release = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "http2"] }
tokio = { version = "1", features = ["time", "sync", "rt", "macros"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
sha2 = "0.11"
base64 = "0.22"
getrandom = "0.3"
thiserror = "2"
httpdate = "1"

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
p256 = { version = "0.14", features = ["ecdsa"] }
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
