spring:
  application:
    name: lms-backend
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/migration-test
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    # Mirrors src/main/resources/application.yml's local-dev default.
    # Required here for the same shadowing reason as app.content.material
    # below - spring.mail.host must be present for Spring Boot's
    # MailSenderAutoConfiguration to register a JavaMailSender bean at all;
    # without it, every @SpringBootTest in the whole backend fails to build
    # its ApplicationContext once notification-management's beans (which
    # depend on JavaMailSender) are on the classpath. No test sends real
    # mail - MessagingProviderApi is mocked/faked wherever a test would
    # otherwise trigger an actual send.
    host: localhost
    port: 1025
    username: ""
    password: ""

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # Mirrors src/main/resources/application.yml's fix - the mail starter's
      # auto-registered MailHealthIndicator opens a real SMTP connection as
      # part of /actuator/health, which fails in this environment (no SMTP
      # server actually listening on localhost:1025) and flips the endpoint
      # to 503. Disabled for the same reason as the main config: SMTP
      # reachability is not a meaningful platform liveness signal.
      enabled: false

logging:
  structured:
    format:
      console: logstash

payment:
  gateway:
    # Fixed, clearly-not-a-production test-only secret (MVP-010/PAY-2) - see
    # application.yml's own comment for why the main default is empty
    # instead. Individual tests needing a different value override it via
    # @TestPropertySource.
    webhook-secret: "test-only-webhook-secret-not-for-production-use"

app:
  mail:
    from-address: "no-reply@example.com"
  content:
    material:
      # Mirrors src/main/resources/application.yml's default. Required here
      # because Spring Boot's classpath:/application.yml config-data
      # resolution picks a single resource (the test-classes copy shadows
      # the main-classes copy on the test classpath), so this property is
      # NOT inherited from src/main/resources/application.yml the way a
      # developer might assume - MaterialService's @Value binding for it
      # has no Java-side default, so every @SpringBootTest in the whole
      # backend fails to build its ApplicationContext without this entry.
      # Individual test classes needing a different limit override it via
      # @TestPropertySource (e.g. MaterialUploadIntegrationTest).
      max-file-size-bytes: 26214400
  payment:
    slip:
      # Mirrors src/main/resources/application.yml's own not-ratified 25MB
      # default (MVP-011 §21 item 11) - required here for the same reason
      # as app.content.material.max-file-size-bytes above: SlipUploadService's
      # @Value binding has no Java-side default, so every @SpringBootTest in
      # the whole backend fails to build its ApplicationContext without this
      # entry once the payment-management slip sub-module's beans are on the
      # classpath.
      max-file-size-bytes: 26214400
