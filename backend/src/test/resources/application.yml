spring:
  application:
    name: lms-backend
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/migration-test
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: logstash
