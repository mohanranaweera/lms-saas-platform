spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/lms_dev}
    username: ${DB_USERNAME:lms_app}
    password: ${DB_PASSWORD:change_this_local_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          # Local dev talks to a local SMTP catcher (MailHog/Mailpit), not
          # Gmail - override the base application.yml's Gmail-oriented
          # auth: true back off here so local startup/send never depends on
          # a catcher supporting SMTP AUTH.
          auth: false

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

object-storage:
  # Local dev talks to the docker-compose.dev.yml MinIO service (S3
  # -compatible) - endpoint/bucket/region are dev-only defaults with no
  # equivalent in the base application.yml (which fails closed to
  # UnavailableObjectStorageApi until every OBJECT_STORAGE_* var is set).
  # Credentials default to the same MINIO_ROOT_USER/MINIO_ROOT_PASSWORD
  # values docker-compose.dev.yml provisions the MinIO container with
  # (see infrastructure/.env.dev), mirroring how spring.datasource above
  # defaults to POSTGRES_USER/POSTGRES_PASSWORD's own dev values.
  endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
  region: ${OBJECT_STORAGE_REGION:us-east-1}
  bucket: ${OBJECT_STORAGE_BUCKET:lms-dev}
  access-key: ${OBJECT_STORAGE_ACCESS_KEY:${MINIO_ROOT_USER:lms_minio}}
  secret-key: ${OBJECT_STORAGE_SECRET_KEY:${MINIO_ROOT_PASSWORD:change_this_local_password}}

app:
  security:
    jwt:
      # Never a real secret in this file - JWT_SECRET must be set via a real
      # env var in every non-local environment. This default is a clearly
      # -fake, dev-only placeholder, long enough to satisfy HS256's minimum
      # 256-bit key length so local startup never silently falls back to a
      # weak key.
      secret: ${JWT_SECRET:dev-only-placeholder-secret-change-me-before-any-real-deployment-32bytes+}
