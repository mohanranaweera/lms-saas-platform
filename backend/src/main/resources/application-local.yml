spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/lms_dev}
    username: ${DB_USERNAME:lms_app}
    password: ${DB_PASSWORD:change_this_local_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt:
      # Never a real secret in this file - JWT_SECRET must be set via a real
      # env var in every non-local environment. This default is a clearly
      # -fake, dev-only placeholder, long enough to satisfy HS256's minimum
      # 256-bit key length so local startup never silently falls back to a
      # weak key.
      secret: ${JWT_SECRET:dev-only-placeholder-secret-change-me-before-any-real-deployment-32bytes+}
    cors:
      # Only read by SecurityFilterChainConfig's @Profile("local")
      # corsConfigurationSource bean - see that bean's javadoc. The Next.js
      # dev server's own origin, never the API host it calls (tenant
      # subdomain resolution is independent of CORS's allowed-origin list).
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://demo.localhost:3000}
