spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/lms_dev}
    username: ${DB_USERNAME:lms_app}
    password: ${DB_PASSWORD:change_this_local_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          # Local dev talks to a local SMTP catcher (MailHog/Mailpit), not
          # Gmail - override the base application.yml's Gmail-oriented
          # auth: true back off here so local startup/send never depends on
          # a catcher supporting SMTP AUTH.
          auth: false

server:
  port: ${BACKEND_PORT:8080}
  # TEN-DOM-01: the frontend calls /api on each site's own address and the Next
  # dev server proxies it here, passing the site's host in X-Forwarded-Host.
  # Tomcat trusts that header only from its internal-proxy ranges (loopback,
  # private), same as prod behind Nginx.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info

object-storage:
  # Local dev talks to the docker-compose.dev.yml MinIO service (S3
  # -compatible) - endpoint/bucket/region are dev-only defaults with no
  # equivalent in the base application.yml (which fails closed to
  # UnavailableObjectStorageApi until every OBJECT_STORAGE_* var is set).
  # Credentials default to the same MINIO_ROOT_USER/MINIO_ROOT_PASSWORD
  # values docker-compose.dev.yml provisions the MinIO container with
  # (see infrastructure/.env.dev), mirroring how spring.datasource above
  # defaults to POSTGRES_USER/POSTGRES_PASSWORD's own dev values.
  endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
  region: ${OBJECT_STORAGE_REGION:us-east-1}
  bucket: ${OBJECT_STORAGE_BUCKET:lms-dev}
  access-key: ${OBJECT_STORAGE_ACCESS_KEY:${MINIO_ROOT_USER:lms_minio}}
  secret-key: ${OBJECT_STORAGE_SECRET_KEY:${MINIO_ROOT_PASSWORD:change_this_local_password}}

app:
  public:
    tenant-url-template: ${TENANT_URL_TEMPLATE:http://{subdomain}.lms.test:3000}
  # TEN-DOM-01: local custom domains. accept-all skips DNS, so any hostname
  # you map in the hosts file (e.g. learn.abc.test -> 127.0.0.1) verifies.
  custom-domains:
    platform-domain: ${PLATFORM_DOMAIN:lms.test}
    cname-target: ${CUSTOM_DOMAIN_CNAME_TARGET:tenants.lms.test}
    verification-mode: accept-all
  security:
    jwt:
      # Never a real secret in this file - JWT_SECRET must be set via a real
      # env var in every non-local environment. This default is a clearly
      # -fake, dev-only placeholder, long enough to satisfy HS256's minimum
      # 256-bit key length so local startup never silently falls back to a
      # weak key.
      secret: ${JWT_SECRET:dev-only-placeholder-secret-change-me-before-any-real-deployment-32bytes+}

video-playback:
  token:
    # Same clearly-fake, dev-only placeholder pattern as app.security.jwt
    # above, but a DISTINCT value (PlaybackTokenService must never share the
    # login-token secret). Without it, local video playback always 503s.
    # Non-local environments keep application.yml's empty, fail-closed
    # default and must set VIDEO_PLAYBACK_TOKEN_SECRET via a real env var.
    secret: ${VIDEO_PLAYBACK_TOKEN_SECRET:dev-only-video-playback-placeholder-change-me-32bytes+}

payment:
  gateway:
    # Local only: keep the pre-PAY-GW-01 fake gateway when a tenant has no
    # PayHere account configured.
    fake-fallback-enabled: true
  credentials:
    # Clearly-fake, dev-only key (Base64 of "dev-only-payment-cred-key-32byte").
    encryption-key: ${PAYMENT_CREDENTIALS_ENCRYPTION_KEY:ZGV2LW9ubHktcGF5bWVudC1jcmVkLWtleS0zMmJ5dGU=}
  payhere:
    # PayHere cannot call localhost - set PAYHERE_NOTIFY_URL to a public
    # tunnel (e.g. ngrok) URL ending in /api/v1/integrations/webhooks/payhere
    # to test with PayHere sandbox credentials.
    notify-url: ${PAYHERE_NOTIFY_URL:}
    return-url-template: ${PAYHERE_RETURN_URL_TEMPLATE:http://{subdomain}.lms.test:3000}

integrations:
  media:
    # Clearly-fake, dev-only key (Base64 of "dev-only-media-cred-key-32bytes!").
    # Without it every provider connect fails closed with 503 SERVICE_UNAVAILABLE.
    encryption-key: ${MEDIA_CREDENTIALS_ENCRYPTION_KEY:ZGV2LW9ubHktbWVkaWEtY3JlZC1rZXktMzJieXRlcyE=}
