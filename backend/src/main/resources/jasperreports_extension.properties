# RPT-01: bundled report fonts (Noto Sans, Noto Sans Sinhala, Noto Sans Tamil;
# SIL OFL 1.1 - see reports/fonts/OFL*.txt) registered as a Jasper font
# extension, plus the "LMS Sans" font set so mixed Latin/Sinhala/Tamil text
# renders with the right family per script.
net.sf.jasperreports.extension.registry.factory.lms.fonts=net.sf.jasperreports.engine.fonts.SimpleFontExtensionsRegistryFactory
net.sf.jasperreports.extension.simple.font.families.lms=reports/fonts/fonts.xml
# Complex scripts (Sinhala/Tamil need glyph shaping) are drawn through AWT
# glyph rendering in the PDF exporter. Jasper 7.1's default
# (net.sf.jasperreports.export.pdf.glyph.renderer.blocks.default) already lists
# sinhala and tamil; this entry states it explicitly for this application.
net.sf.jasperreports.export.pdf.glyph.renderer.blocks.lms=sinhala,tamil
