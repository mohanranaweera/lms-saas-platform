spring:
  application:
    name: lms-backend
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  mail:
    # MVP-018 email notifications - production relay is Google/Gmail SMTP,
    # confirmed directly with the requester (see
    # docs/requirements/open-decisions.md §22 "SMTP relay: Gmail" and
    # docs/architecture/integration-architecture.md §8, both updated to
    # record this choice - not an unreviewed default).
    # host/port are Gmail's well-known, non-secret SMTP endpoint (STARTTLS on
    # 587) - safe to default directly; MAIL_HOST/MAIL_PORT remain available to
    # override for a different relay later with no code change. This base
    # profile's defaults apply whenever application-local.yml's own
    # MAIL_HOST/MAIL_PORT-driven override (localhost:1025, a local SMTP
    # catcher) is NOT active - i.e. every non-local environment.
    #
    # MAIL_USERNAME must be a full Gmail/Google Workspace address; MAIL_PASSWORD
    # MUST be a 16-character Google "App Password" (Google rejects the regular
    # account password for SMTP auth) - generated under the Google Account's
    # Security > 2-Step Verification > App passwords settings (2-Step
    # Verification must be enabled on that account first). Never a real
    # credential in this file - both intentionally have no default, so a
    # misconfigured non-local deployment fails closed at send time (auth
    # failure -> that row marked FAILED) rather than silently trying with an
    # empty credential. app.mail.from-address below should match MAIL_USERNAME
    # unless a verified Gmail "Send As" alias is configured - Gmail rejects or
    # silently rewrites a From address that doesn't match the authenticated
    # account.
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # MVP-018 fix (database-architect review finding): without these,
          # a stalled/unresponsive relay blocks NotificationDispatchService's
          # sendEmail call indefinitely, stalling the whole sequential
          # dispatch batch behind it. All three in milliseconds, matching
          # JavaMailSender's expected property type.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # spring-boot-starter-mail auto-registers a MailHealthIndicator that
      # opens a real SMTP connection as part of /actuator/health - disabled
      # here because SMTP reachability is not a meaningful platform liveness
      # signal (no production SMTP relay/vendor is selected yet per
      # integration-architecture.md §8, and NotificationDispatchService
      # already handles a down/unreachable relay gracefully by marking that
      # row FAILED - it should never make the whole platform report DOWN).
      enabled: false

logging:
  structured:
    format:
      console: logstash

payment:
  gateway:
    # MVP-010/PAY-2 webhook HMAC secret - never a real secret in this file.
    # PAYMENT_GATEWAY_WEBHOOK_SECRET must be set via a real env var in every
    # non-local environment; the empty default here makes
    # WebhookSignatureVerifier fail closed (reject every signature) rather
    # than silently accepting webhooks signed with a well-known placeholder,
    # unlike JWT_SECRET's dev-only-placeholder pattern above.
    webhook-secret: ${PAYMENT_GATEWAY_WEBHOOK_SECRET:}

live-class:
  provider:
    # Wave 4 live-class meeting-provider webhook HMAC secret - never a real
    # secret in this file, same fail-closed-empty-default rationale as
    # payment.gateway.webhook-secret above. LIVE_CLASS_PROVIDER_WEBHOOK_SECRET
    # must be set via a real env var in every non-local environment.
    webhook-secret: ${LIVE_CLASS_PROVIDER_WEBHOOK_SECRET:}

object-storage:
  # Wave 5 (S3ObjectStorageApi / UnavailableObjectStorageApi conditional
  # bean pair) - S3-compatible object storage (AWS SDK v2, works against
  # MinIO in dev and any S3-compatible vendor in production). Never a real
  # value in this file, same blank-default-fail-closed rationale as
  # payment.gateway.webhook-secret above - bucket blank means
  # UnavailableObjectStorageApi (503) stays the active bean; setting all
  # four OBJECT_STORAGE_* env vars in a real environment activates
  # S3ObjectStorageApi instead. See application-local.yml for this
  # environment's own MinIO-pointed override.
  endpoint: ${OBJECT_STORAGE_ENDPOINT:}
  region: ${OBJECT_STORAGE_REGION:us-east-1}
  bucket: ${OBJECT_STORAGE_BUCKET:}
  access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
  secret-key: ${OBJECT_STORAGE_SECRET_KEY:}

video-playback:
  token:
    # Wave 5 (PAR-20-01) video-playback JWT signing secret - deliberately a
    # DISTINCT secret from app.security.jwt.secret (never reused/derived from
    # it), so a leaked playback token can never be replayed as a login
    # session and vice versa (PlaybackTokenService's own javadoc). Same
    # empty-default-fail-closed rationale as payment.gateway.webhook-secret
    # above (never a dev-only placeholder like JWT_SECRET) -
    # VIDEO_PLAYBACK_TOKEN_SECRET must be set via a real env var in every
    # non-local environment; until then PlaybackTokenService refuses to
    # issue/validate any playback token with a clean 503, not a silently
    # -accepted forged token.
    secret: ${VIDEO_PLAYBACK_TOKEN_SECRET:}

app:
  security:
    # Argon2id parameters (AUTH-3), OWASP-baseline defaults - see
    # Argon2PasswordEncoderConfig/Argon2Properties. Never hardcode these
    # inline in the bean method; override per-environment via the env vars
    # wired in application-local.yml if a deployment needs different cost
    # parameters.
    argon2:
      salt-length: 16
      hash-length: 32
      parallelism: 1
      memory-kib: 19456
      iterations: 2
    # JWT access-token lifetime (ADR-007 decision 1: 15 minutes, sub/tenant_id/
    # role/session_id only, no permission list). The signing secret itself is
    # never set here - see application-local.yml/.env.example.
    jwt:
      access-token-ttl: 15m
    # Refresh-token/session lifetime. refresh-token-ttl is the absolute
    # lifetime cap (ADR-007 "recommends" 30 days - not a ratified constant,
    # hence config-driven, plan §21). cache-ttl bounds how long the Redis
    # fast-path may report a session valid before the next Postgres read.
    session:
      refresh-token-ttl: 30d
      cache-ttl: 60s
  content:
    material:
      # MVP working default - accepted file types/size limit are not defined
      # anywhere in the requirements corpus (docs/plans/MVP-009 Lessons and
      # Learning Materials.md §21 item 5); 25 MB and the PDF/image/plain-text
      # allow-list in ContentSniffer are this implementation's own default,
      # flagged for confirmation, not a ratified business decision.
      max-file-size-bytes: 26214400
  mail:
    # MVP-018 email notifications - the one email-sending property Spring
    # Boot's spring.mail.* auto-configuration doesn't provide: the From
    # address stamped on outgoing mail by SmtpMessagingProviderApi. Never a
    # real address in this file; override via MAIL_FROM_ADDRESS per
    # environment.
    from-address: ${MAIL_FROM_ADDRESS:no-reply@example.com}
  payment:
    slip:
      # MVP working default, mirroring app.content.material's own
      # not-specified-anywhere gap (docs/plans/MVP-011 Manual Payment Slips.md
      # §21 item 11) - 25 MB, deliberately re-declared here rather than
      # reusing app.content.material.max-file-size-bytes, since the two
      # upload paths are differently scoped and nothing ties their limits
      # together as a matter of ratified business decision.
      max-file-size-bytes: 26214400
  finance:
    expense:
      # Wave 7 working default for expense receipt uploads (PDF/PNG/JPEG) -
      # not specified anywhere in the requirements corpus, same
      # not-ratified status as app.payment.slip.max-file-size-bytes; 10 MB is
      # this implementation's own default, flagged in wave-07-plan.md.
      max-attachment-size-bytes: 10485760
  video-access:
    asset:
      # Wave 5 working default, mirroring app.content.material/app.payment.slip's
      # own not-ratified-anywhere gap - 25 MB, deliberately re-declared here
      # rather than reusing either sibling property, for the same
      # differently-scoped-upload-path reason documented on
      # app.payment.slip.max-file-size-bytes above.
      max-file-size-bytes: 26214400
