name: CI
on:
pull_request: branches:
- main push:
branches:
- main

permissions: contents: read
jobs:
backend:
name: Backend Maven Verify runs-on: ubuntu-latest

defaults: run:
working-directory: backend
steps:
45

- name: Checkout
uses: actions/checkout@v4

- name: Set up Java
uses: actions/setup-java@v4 with:
distribution: temurin java-version: "21" cache: maven

- name: Verify Maven wrapper run: ./mvnw -v
- name: Run backend verification
run: ./mvnw --batch-mode clean verify
frontend:
name: Frontend Build runs-on: ubuntu-latest
defaults: run:
working-directory: frontend

steps:
- name: Checkout
uses: actions/checkout@v4
- name: Set up Node.js
uses: actions/setup-node@v4 with:
node-version: "24" cache: npm
cache-dependency-path: frontend/package-lock.json
- name: Install dependencies run: npm ci
- name: Lint
run: npm run lint

- name: Build
run: npm run build
