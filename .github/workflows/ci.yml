name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend Maven Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Maven wrapper
        run: ./mvnw -v

      - name: Run backend verification
        run: ./mvnw --batch-mode clean verify

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # `src/lib/env.ts` validates this at module-evaluation time (both `next
      # build` and the `next dev` server Playwright's `webServer` spins up
      # need it present, or the process fails before any test/route runs).
      # No real backend needs to be reachable at this URL in CI: `npm run
      # build` only needs a syntactically valid URL to satisfy the Zod
      # schema, and every Playwright spec mocks its own API calls via
      # `page.route()` rather than hitting this address. Kept identical to
      # `.env.example`'s local-dev value for consistency, not because CI
      # depends on a real server living there.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
